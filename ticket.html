<!doctype html>
<html lang="en-ZA" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open a Ticket | Compatible Automotive</title>
  <meta name="description" content="Log a support ticket with Compatible Automotive for Titan DMS, CRM, websites, digital marketing and image enhancement.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261015b">
</head>
<body data-page="ticket">
<div id="site-header"></div>

<main id="main" class="ticket-page">
  <div class="container ticket-wrap">
    <header class="ticket-intro">
      <h1>How can we help?</h1>
      <p>Tell us what you need assistance with and our support team will help.</p>
    </header>
    <div class="ticket-card">
      <!-- Teamwork Desk support ticket form -->
      <iframe id="deskcontactwidgetframe" src="https://compatibleautomotive1.teamwork.com/support/contactform.html?token=b78f8b24-cb9c-11f1-a3fb-8e0054b5aa9b" title="Open a support ticket" width="100%" height="600" frameborder="0" style="display:block; border:0;"></iframe>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/main.js?v=20261015b"></script>
<script>
  // Teamwork Desk form shown inline: open it once ready and size the frame to fit its content
  (function () {
    var frame = document.getElementById("deskcontactwidgetframe");
    window.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type === "tw-contact-form-is-ready") frame.contentWindow.postMessage({ type: "tw-contact-form-toggle-widget", value: true }, "*");
      if (d[0] === "setContactFormHeight") frame.height = d[1];
    }, false);
  })();
</script>
</body>
</html>
